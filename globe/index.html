<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Globe view (MapLibre)</title>
    <!--
        This experiment is rendered with the MapLibre GL build of the MapML
        custom elements (dist/MapML-MapLibre), which can present the same
        MapML markup on a 3-D globe. The `view` attribute selects the camera
        regime: map (flat 2-D), globe (3-D globe) or perspective (tilted 2-D).
        `controlslist="view"` adds a toggle that cycles map -> globe ->
        perspective so the identical layer can be compared across views.
      -->
    <script type="module" src="../dist/MapML-MapLibre/dist/mapml-maplibre.js"></script>
    <link rel="stylesheet" href="../global.css" />
    <style>
      html,
      body {
        height: 100%;
      }

      mapml-viewer:defined {
        width: 100%;
        height: 100%;
      }

      mapml-viewer:not(:defined)>* {
        display: none;
      }

      map-layer {
        display: none;
      }
    </style>
  </head>
  <body>
    <mapml-viewer view="globe" controls lat="64.1" lon="-101.3" zoom="2" bearing="0" pitch="0" controlslist="view search compass static featureindex geolocation">
      <map-layer label="OpenStreetMap" checked>
        <map-link rel="suggestions" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
        <map-link rel="search" tref="https://photon.komoot.io/api?q={searchTerms}"></map-link>
        <map-link rel="license" href="https://www.openstreetmap.org/copyright" title="© OpenStreetMap contributors (CC BY-SA 2.0)"></map-link>
        <!-- <map-link rel="license" href="https://open.canada.ca/en/open-government-licence-canada" title="Open Government Licence - Canada"></map-link> -->
        <!-- obtained from https://www.arcgis.com/sharing/rest/content/items/516e82031eee4e97a71652ebb0e94879/resources/styles/root.json 
        <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="./root.json"></map-link>-->
        <map-link rel="stylesheet" type="application/vnd.maplibre-style+json" href="./svwd03style.json"></map-link>
        <map-extent units="OSMTILE" checked>
          <map-input name="zed" type="zoom" min="0" max="18"></map-input>
          <map-input name="ex" type="location" axis="column" units="tilematrix"></map-input>
          <map-input name="why" type="location" axis="row" units="tilematrix"></map-input>
          <map-link rel="tile" type="application/vnd.mapbox-vector-tile" tref="https://vector.openstreetmap.org/shortbread_v1/{zed}/{ex}/{why}.mvt"></map-link>
          <!-- <map-link rel="tile" type="application/vnd.mapbox-vector-tile" 
            tref="https://tiles.arcgis.com/tiles/HsjBaDykC1mjhXz9/arcgis/rest/services/CBMT_CBCT_3857_V_OSM/VectorTileServer/tile/{zed}/{why}/{ex}.pbf"></map-link> -->
        </map-extent>
      </map-layer>
    </mapml-viewer>
  </body>
</html>
