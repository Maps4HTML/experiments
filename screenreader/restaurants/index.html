<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ottawa Restaurants</title>
    <script type="module" src="../../dist/mapml.js"></script>
    <link rel="stylesheet" href="../../global.css">
    <script src="/shared/script/photon-search-handler.js"></script>
  </head>
  <body>

      <map-layer label="CBMT" src="/experiments/refactoring-temporary/cbmtile-cbmt.mapml" checked hidden></map-layer>-->
    <mapml-viewer projection="OSMTILE" zoom="14" lat="45.406314" lon="-75.6883335" controls controlslist="geolocation search">
      <map-caption>Ottawa Restaurants Map</map-caption>
      <!-- the osm.mapml includes search and suggestions links to photon,
           and this page relies on the default search/suggestions handler -->
      <map-layer label="OpenStreetMap" src="../../refactoring-temporary/osm.mapml" checked hidden></map-layer>
      <map-layer id="restaurant" label="Restaurants" checked>
        <map-meta name="cs" content="gcrs" ></map-meta>
        <map-meta name="extent" content="top-left-easting=-8433179, top-left-northing=5689316, bottom-right-easting=-8420968, bottom-right-northing=5683139"></map-meta>
        <map-extent units="OSMTILE" checked hidden>
           <map-select id="restaurants" name="cusine">
              <map-option value="restaurants" selected>All cuisines</map-option>
              <map-option value="african">African</map-option>
              <map-option value="asian">Asian</map-option>
              <map-option value="cajun">Cajun</map-option>
              <map-option value="indian">Indian</map-option>
              <map-option value="italian">Italian</map-option>
              <map-option value="mexican">Mexican</map-option>
            </map-select>
            <map-link tref="../../shared/restaurants/{cusine}.mapml" rel="features"></map-link>
          </map-extent>
      </map-layer>
    </mapml-viewer>
